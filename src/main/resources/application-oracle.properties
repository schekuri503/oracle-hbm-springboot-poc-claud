# Oracle Autonomous Database Configuration

# Option 1: Wallet-based connection (recommended for Oracle Autonomous DB)
# Download the wallet from Oracle Cloud Console and extract to a directory
# Set TNS_ADMIN environment variable or use the property below
# spring.datasource.url=jdbc:oracle:thin:@<service_name>?TNS_ADMIN=/path/to/wallet

# Option 2: Non-wallet JDBC URL (mTLS disabled in Oracle Cloud)
# spring.datasource.url=jdbc:oracle:thin:@(description=(retry_count=3)(retry_delay=3)(address=(protocol=tcps)(port=1522)(host=<hostname>))(connect_data=(service_name=<service_name>))(security=(ssl_server_dn_match=no)))

# Example wallet-based connection:
spring.datasource.url=jdbc:oracle:thin:@<tns_alias>?TNS_ADMIN=${WALLET_PATH:/path/to/wallet}

# Database credentials
spring.datasource.username=${ORACLE_USER:ADMIN}
spring.datasource.password=${ORACLE_PASSWORD:your_password}

# Oracle JDBC Driver
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection pool settings
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
hibernate.hbm2ddl.auto=none
hibernate.show_sql=true
hibernate.format_sql=true

# Disable schema initialization for Oracle (tables should already exist)
spring.sql.init.mode=never
