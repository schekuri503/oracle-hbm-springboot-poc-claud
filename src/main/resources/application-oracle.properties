# Oracle Autonomous Database Configuration (DBCPOC)
#
# SETUP INSTRUCTIONS:
# 1. Download the wallet (Wallet_DBCPOC.zip) from Oracle Cloud Console
# 2. Extract the wallet contents to the ./wallet directory in this project
# 3. Run with: mvn spring-boot:run -Dspring.profiles.active=oracle
#
# Alternatively, set environment variables:
#   export WALLET_PATH=/path/to/extracted/wallet
#   export ORACLE_USER=admin
#   export ORACLE_PASSWORD=your_password

# Wallet-based connection to Oracle Autonomous Database
spring.datasource.url=jdbc:oracle:thin:@dbcpoc_high?TNS_ADMIN=${WALLET_PATH:./wallet}

# Database credentials
spring.datasource.username=${ORACLE_USER:admin}
spring.datasource.password=${ORACLE_PASSWORD:ChasingJennifer123}

# Oracle JDBC Driver
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Connection pool settings
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
hibernate.hbm2ddl.auto=none
hibernate.show_sql=true
hibernate.format_sql=true

# Disable schema initialization for Oracle (tables should already exist)
spring.sql.init.mode=never
